<html>
  <head>
    <title>WD Lesson 2.5</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <script src="script.js"></script>
    <!-- Challenge 1: Create a div container with id of banner.  Add a heading 1 with the text "Gallery" to the container.-->
     <div id="banner">
      <h1>Gallery</h1>
     </div>

    <!-- Challenge 2: Create a div container with class of subbanner. Add a heading 3 with appropriate text that
                      represents the theme of the first photo gallery -->
    <div class="subbanner">
      <h3>Strawberry</h3>
    </div>

    <!-- Challenge 3: Add a brief paragraph describing the theme of the first photo gallery -->
     <p>A strawberry is a sweet, juicy, heart-shaped red fruit that grows low to the ground on green leafy plants.</p>

    <!-- Challenge 4: Create a div container with a class of gallery and an id of firstGallery.  Add at least three images based 
                    on the theme of the first photo gallery-->
    <div class="gallery" id="firstGallery">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKByWR1eu_Xy3g_j45S96AsdUlQASDC1BN2KA4PiVuTw&s=10" height="200">
      <img src="https://www.dole.com/sites/default/files/styles/1024w768h-80/public/media/2025-01/strawberries.png?itok=YwuQG1_Q-rBQD7hNl" height="200">
      <img src="https://clv.h-cdn.co/assets/15/22/2048x2048/square-1432664914-strawberry-facts1.jpg" height="200">
      <img src="https://www.thesophisticatedcaveman.com/wp-content/uploads/2017/06/Strawberries-500x375.jpg" height="200">
      <img src="https://cdn.britannica.com/22/75922-050-D3982BD0/flowers-fruits-garden-strawberry-plant-species.jpg" height="200">
      <img src="https://assets.nutritionfacts.org/2019/01/jacek-dylag-559115-unsplash.jpg" height="200">
    </div>
    <!-- Challenge 5: Create a div container with class of subbanner. Add a heading 3 with appropriate text that
                      represents the theme of the second photo gallery -->
    <div class="subbanner">
      <h3>Blueberry</h3>
    </div>

    <!-- Challenge 6: Add a brief paragraph describing the theme of the second photo gallery -->
    <p>A blueberry is a small, round, dark blue fruit that grows on bushes and is known for its sweet taste and high antioxidant content.</p>

    <!-- Challenge 7: Create a div container with a class of gallery and an id of secondGallery.  Add at least three images based 
                      on the theme of the second photo gallery-->
    <div class="gallery" id="secondGallery">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT71FUQtfstBJyujgC7CUAV4tPOT9kaqWScxAlovnNgMA&s=10" height="200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRwf4ZVXbGlKUtDBGs1oHa9cHPC8II_U3mBBy4hBnuP8Q&s=10" height="200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTOlUpyP_u1uLZyxj3ba1uCbtKg4U_LokOlE7Bn8flgUg&s=10" height="200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDgKXrtVOOxKKY3fYDBp2dMZzCdT6Iz-K2SncO8jjPIA&s" height="200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTc_hpaC-kpdMPLZXCZLe5J7sQkWRqITWriqJZ3swFYg&s=10" height="200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcReg0aoX2LylSQpAGnFDEcyoI4YHaMy44BHurf_0rq2dg&s=10" height="200">
    </div>

  </body>
